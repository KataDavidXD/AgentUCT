[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-uct"
version = "0.1.0"
description = "Backend-agnostic reuse-aware UCT for compositional workflow search"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools.packages.find]
include = ["uct_engine", "uct_engine.*"]
